name: Release Linux Static Binaries & Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-linux-binaries:
    name: Build Static Linux Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux-musl
          - arch: arm64
            target: aarch64-linux-musl

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v3

      - name: Compile Static Linux Binary via Alpine Container
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} -v $(pwd):/workspace -w /workspace alpine:3.19 sh -c "
            apk add --no-cache gcc musl-dev make
            CFLAGS='-Wall -Wextra -Werror -O3 -std=c11 -Iinclude -pthread -static' make clean all
            mv bin/wheelmq bin/wheelmq-linux-${{ matrix.arch }}
            mv bin/wheelmq-cli bin/wheelmq-cli-linux-${{ matrix.arch }}
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: |
            bin/wheelmq-linux-${{ matrix.arch }}
            bin/wheelmq-cli-linux-${{ matrix.arch }}

  publish-release:
    name: Publish GitHub Release & GHCR Container
    needs: build-linux-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all compiled Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Flatten binary structure
        run: |
          mkdir -p dist
          find release-binaries -type f -exec mv {} dist/ \;
          ls -lh dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/wheelmq-linux-amd64
            dist/wheelmq-cli-linux-amd64
            dist/wheelmq-linux-arm64
            dist/wheelmq-cli-linux-arm64
          generate_release_notes: true
