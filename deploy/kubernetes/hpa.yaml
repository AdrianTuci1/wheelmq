apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wheelmq-autoscaler
  namespace: wheelmq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: wheelmq
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
